[project]
name = "archiver"
version = "0.1.0"
description = "Content-oriented local file cataloging"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
]

[project.scripts]
archiver = "archiver.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "itables>=2.9.1",
    "jupyterlab>=4.6.2",
    "mypy>=1.19.0",
    "nbstripout>=0.9.1",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.0.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
